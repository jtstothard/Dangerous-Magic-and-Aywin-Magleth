version: 2
# Each ecosystem gets one patch/minor group and one major group (npm majors
# are ignored, see below), so Dependabot opens at most two PRs per ecosystem
# a week. When a major breaks the build, add an ignore for it instead of
# leaving the major group red.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    ignore:
      # The code here is Quartz upstream's, so npm majors move with a Quartz
      # upstream sync, not one by one. Majors keep breaking its build: the
      # first weekly major group (#76) failed `npx quartz build` on js-yaml 5
      # (no default export), and TypeScript 7 removed the
      # `moduleResolution: node` that Quartz's tsconfig.json uses (#38).
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      docker-major:
        patterns:
          - "*"
        update-types:
          - major
